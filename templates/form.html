{% extends 'base.html' %}{% block content %}<a class="back" href="{{ url_for('detail',item_id=data.id) if editing else url_for('index') }}">← Back</a><div class="heading"><div><div class="eyebrow">{{ 'MAKE IT YOURS' if editing else 'A NEW POSSIBILITY' }}</div><h1>{{ 'Edit opportunity' if editing else 'What’s your next chapter' }}<em>?</em></h1><p>Save the important details now. Take the next step when you’re ready.</p></div></div><form class="panel entry-form" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><div class="form-grid"><label>Opportunity title *<input name="title" maxlength="160" value="{{ data.get('title','') }}" placeholder="e.g. Global leadership scholarship" required></label><label>Organization *<input name="organization" maxlength="120" value="{{ data.get('organization','') }}" placeholder="University, foundation, or company" required></label><label>Opportunity type *<select name="kind">{% for kind in kinds %}<option {{ 'selected' if data.get('kind')==kind }}>{{ kind }}</option>{% endfor %}</select></label><label>Location *<input name="location" maxlength="120" value="{{ data.get('location','') }}" placeholder="e.g. Remote or London, UK" required></label><label>Application deadline *<input name="deadline" type="date" value="{{ data.get('deadline','') }}" required><small>Use the organizer’s deadline date. Verify its exact time and time zone.</small></label><label>Funding / compensation<input name="benefit" maxlength="160" value="{{ data.get('benefit','') }}" placeholder="e.g. Full tuition, or paid internship"></label><label class="full">Official opportunity link<input name="url" type="url" maxlength="1000" value="{{ data.get('url','') }}" placeholder="https://..."></label><label class="full">Eligibility & requirements<textarea name="eligibility" rows="4" maxlength="4000" placeholder="Who can apply? What qualifications or documents are needed?">{{ data.get('eligibility','') }}</textarea></label><label class="full">Your notes<textarea name="notes" rows="4" maxlength="6000" placeholder="Ideas, questions, or anything you want to remember…">{{ data.get('notes','') }}</textarea></label></div><div class="form-actions"><span>* Required fields</span><button class="button primary">{{ 'Save changes' if editing else 'Save opportunity' }} ↗</button></div></form>{% endblock %}
